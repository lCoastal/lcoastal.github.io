function ptToast(t){const d=document.createElement("div");d.className="ptoast";d.setAttribute("role","status");d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),2200)}
// items in one full pan, measured: ≈20 at 400 capacity, ≈44 at 1,600, ≈87 at 5,462 (plain √capacity undercounts big pans)
function panItems(cap){return Math.max(1,0.6779*Math.pow(Math.max(1,+cap||1),0.56474))}
// luck model helper: minerals with the same odds share one slot evenly (otherwise whichever is listed first takes the whole slot)
// very rare minerals (base odds about 1 in 18 million to 1 in 1.6 billion) drop about 1.9x more often than the roll model alone says;
// measured over ~2.4M logged minerals in 11 zones. Rarer or commoner minerals are unchanged.
function rareBand(N){const l=Math.log10(Math.max(1,N)),up=Math.min(1,Math.max(0,(l-7.26)/.5)),dn=Math.min(1,Math.max(0,(9.67-l)/.5));return 1+.858*Math.min(up,dn)}
const _TIE=new WeakMap();
function tieSpan(list,x,tot){let m=_TIE.get(list);if(!m){m=new Map();let c=0;list.forEach(y=>{const g=m.get(y.p);if(g){g[1]+=y.p;g[2]++}else m.set(y.p,[c,c+y.p,1]);c+=y.p});_TIE.set(list,m)}const g=m.get(x.p);return [g[0]/tot,g[1]/tot,g[2]]}
// Mineral weight (fitted 17/11/26 on ~1.5M logged minerals, capacity 1,856-7,240; top checked 24/11/26 on 2.57M):
// Weight = BaseWeight x (1 + Size Boost) x zone factor x k (x1.5 Solar Magnifier). Most k are between 0.75 and 15.5:
// 26.1% small k~U(0.75,1.88); h(cap) skewed k=0.75+14.75*Beta(a,1.99); the rest k~U(0.75,15.5).
// h = 0.533(1-e^-((cap-1797)/2266)), a = 4.24 + 0.000667 cap
// At times about a quarter of minerals come out x1.1, so k reaches 17.0: about 1.4% of all minerals land between 15.5 and 17,
// thinning out towards 17 (WT_TAIL, a straight-line fade).
const WT_MIN=.75,WT_TOP=15.5,WT_MAX=17,WT_TAIL=.014,WT_SMALL=.261,WT_SM_HI=1.88,WT_B=1.99;

// each zone's lightest roll is exactly 0.75 x its factor, and the factors come in steps (0.80, 0.88, 0.92, 0.96, 1.00, 1.04, 1.12, 1.20).
// Azuralite Oasis, Volcanic Springs, Crystal Cavern River and Overgrown Grotto weren't in that log: their values are from the
// smaller 20/11/26 log, put on the nearest step. Zones not listed count as 1.
const ZONE_SIZE={"Rubble Creek Sands":0.8,"Rubble Creek Deposits":0.88,"Fortune River":0.92,"Magma Furnace":0.96,"Volcanic Sands":0.96,"Sunset Beach":0.96,"Windswept Beach":0.96,"Azuralite Oasis":0.96,"Fortune River Delta":1,"Frostbite River":1,"Frostbite Waterfall":1,"Lifespring Oasis":1,"Meteor Falls":1,"Mystic Floodplains":1,"Sandstone Stream":1,"Starfall River":1,"Volcanic Springs":1,"Crystal Cavern River":1,"Astral Caverns":1.04,"Deeproot Spring":1.04,"Enchanted Ruins":1.04,"Frozen Peak":1.04,"Fungal Marsh":1.04,"Rotwood Swamp":1.04,"Overgrown Grotto":1.04,"Abyssal Depth":1.12,"Infernal Heart":1.12,"Timelocked Sanctuary":1.2};
// minerals logged per zone for the factors above (zones missing here come from the older log)
const ZONE_SIZE_N={"Rubble Creek Sands":84630,"Rubble Creek Deposits":16154,"Fortune River":14489,"Magma Furnace":28547,"Volcanic Sands":18912,"Sunset Beach":100526,"Windswept Beach":89412,"Fortune River Delta":21377,"Frostbite River":10017,"Frostbite Waterfall":14703,"Lifespring Oasis":54271,"Meteor Falls":102014,"Mystic Floodplains":960663,"Sandstone Stream":246579,"Starfall River":13469,"Astral Caverns":26855,"Deeproot Spring":5371,"Enchanted Ruins":295169,"Frozen Peak":118387,"Fungal Marsh":101876,"Rotwood Swamp":45588,"Abyssal Depth":25039,"Infernal Heart":87235,"Timelocked Sanctuary":86449};
const zoneSize=loc=>loc?(ZONE_SIZE[baseLoc(loc)]??ZONE_SIZE[loc]??1):1;
// <option>s for a zone picker: "Most zones" (x1) first, then every measured zone with its factor
const zoneSizeOpts=sel=>`<option value="">Most zones (×1)</option>`+Object.keys(ZONE_SIZE).sort().map(z=>`<option value="${z}"${z===sel?" selected":""}>${z} (×${ZONE_SIZE[z].toFixed(2)})</option>`).join("");
function wtModel(cap){cap=Math.max(1,+cap||0);const h=Math.max(0,.533*(1-Math.exp(-(cap-1797)/2266))),a=Math.max(1.01,4.24+.000667*cap),pu=1-WT_SMALL-h;
  const N=2000,cdf=new Float64Array(N+1);let acc=0,prev=0;for(let i=0;i<=N;i++){const r=i/N,v=r<=0||r>=1?0:Math.pow(r,a-1)*Math.pow(1-r,WT_B-1);if(i)acc+=(prev+v)/2;cdf[i]=acc;prev=v}for(let i=0;i<=N;i++)cdf[i]/=acc;
  const bcdf=r=>{if(r<=0)return 0;if(r>=1)return 1;const x=r*N,i=Math.floor(x);return cdf[i]+(cdf[i+1]-cdf[i])*(x-i)};

  const sf0=x=>WT_SMALL*cl((WT_SM_HI-x)/(WT_SM_HI-WT_MIN))+pu*cl((WT_TOP-x)/W)+h*(1-bcdf((x-WT_MIN)/W));
  const pdf0=x=>x<WT_MIN||x>WT_TOP?0:(x<=WT_SM_HI?WT_SMALL/(WT_SM_HI-WT_MIN):0)+pu/W+h*((bcdf((x-WT_MIN)/W+.0005)-bcdf((x-WT_MIN)/W-.0005))/.001)/W;

  const sf=x=>x>=WT_MAX?0:x>WT_TOP?WT_TAIL*Math.pow((WT_MAX-x)/TL,2):(1-WT_TAIL)*sf0(x)+WT_TAIL;
  const pdf=x=>x<WT_MIN||x>WT_MAX?0:x>WT_TOP?2*WT_TAIL*(WT_MAX-x)/(TL*TL):(1-WT_TAIL)*pdf0(x);

  const q=p=>{if(p>=1)return WT_MIN;if(p<=0)return WT_MAX;let lo=WT_MIN,hi=WT_MAX;for(let i=0;i<60;i++){const m=(lo+hi)/2;sf(m)>p?lo=m:hi=m}return (lo+hi)/2};
  const mean=(1-WT_TAIL)*(WT_SMALL*(WT_MIN+WT_SM_HI)/2+pu*(WT_MIN+WT_TOP)/2+h*(WT_MIN+W*a/(a+WT_B)))+WT_TAIL*(WT_TOP+TL/3);
  return {sf,pdf,q,mean,h,a,pu,cap}}
// your stats (luck, capacity, Size Boost, magnifier, modifier boost, pans per hour) are typed once and shared by every tool:
// ptYouLink(S,{stateKey:sharedKey},redraw) fills S from the shared copy now and whenever another tool changes it,
// and returns a function that sends S's values back (call it when saving)
function ptYouLink(S,map,redraw){const get=()=>{try{return window.parent.ptYou.get()}catch(e){return {}}};
  const pull=()=>{const y=get();let ch=false;Object.keys(map).forEach(k=>{const v=y[map[k]];if(v!==undefined&&v!==null&&v!==""&&String(S[k])!==String(v)){S[k]=v;ch=true}});return ch};
  pull();window.ptYouChanged=()=>{if(pull()&&redraw)redraw()};
  return ()=>{const o={};Object.keys(map).forEach(k=>o[map[k]]=S[k]);try{window.parent.ptYou.set(o,window)}catch(e){}}}
// one mineral at your stats, for the mineral page: chance per mineral and per pan in each zone, and its weight range
function ptMineralStats(name,you){const mins=P.mins||[];const m=mins.find(x=>x.n===name);if(!m)return null;you=you||{};
  const L=Math.max(1,+you.luck||1),cap=Math.max(1,+you.cap||1),items=panItems(cap);
  const LOC={};mins.forEach(x=>(x.ch||[]).forEach(c=>{const p=parseFloat(String(c[1]).replace(/[%,]/g,""))/100;if(p>0)(LOC[c[0]]=LOC[c[0]]||[]).push({m:x,p})}));
  const full=loc=>{const b=baseLoc(loc),own=LOC[loc]||[];let out;
    if(b!==loc&&LOC[b])out=LOC[b].filter(x=>!own.some(y=>y.m===x.m)).concat(own);
    else if(own.length<2){const seen=new Set();out=[];Object.keys(LOC).filter(v=>v!==loc&&baseLoc(v)===loc).forEach(v=>LOC[v].concat(own).forEach(x=>{if(!seen.has(x.m)){seen.add(x.m);out.push(x)}}))}
    else out=[...own];return out.length<2?[]:out};
  const f=(lo,hi,l)=>Math.pow(1-lo,l)-Math.pow(1-hi,l);
  const zones=(m.ch||[]).map(c=>{const list=full(c[0]).sort((a,b)=>a.p-b.p);const x=list.find(y=>y.m===m);if(!x)return {z:c[0]};
    const tot=list.reduce((s,y)=>s+y.p,0);const [lo,hi,sn]=tieSpan(list,x,tot);
    const q=Math.min(1,(.2891*f(lo,hi,1)+.0280*f(lo,hi,Math.max(1,.04317*L))+.1905*f(lo,hi,Math.max(1,.40579*L))+.4924*f(lo,hi,Math.max(1,1.74153*L)))/sn*rareBand(tot/x.p));
    return {z:c[0],q,pan:1-Math.pow(1-q,items)}});
  let wt=null;if(m.bw>0){const W=wtModel(cap),k=m.bw*(1+Math.max(0,+you.sb||0)/100)*(you.mag?1.5:1);wt={lo:k*WT_MIN,mid:k*W.q(.5),hi:k*WT_MAX,top:k*W.q(.01)}}
  return {zones,items,wt,luck:L,cap}}
// "Save as image" and "Copy as text" for pages whose result is a heading (.head), tiles (div > .lab, b, small) and tables:
// both are read straight from what the page shows. parts=[{h, el}] in order; head = the .head element (picture, name, details)
function ptPageRead(head,parts){const T=e=>(e?e.textContent:"").replace(/\s+/g," ").trim();
  const img=head&&head.querySelector("img"),hb=head&&head.querySelector("b"),hs=head&&head.querySelector("span");
  const out={title:T(hb)||document.title,tic:img?img.src:"",sub:T(hs)?T(hs).split(/, |, /):[],secs:[]};
  parts.forEach(({h,el})=>{if(!el||el.hidden||!el.innerHTML.trim())return;const tb=el.querySelector("table");
    if(tb){const ths=[...tb.querySelectorAll("tr:first-child th")].filter(th=>T(th)||!th.classList.contains("hide-s"));const n=ths.length;
      const rows=[...tb.querySelectorAll("tr")].filter(r=>r.querySelector("td")).map(r=>[...r.querySelectorAll("td")].slice(0,n).map((td,i)=>{const im=td.querySelector("img");return {t:T(td),ic:i===0&&im?im.src:"",mono:i>0,b:i===0}}));
      out.secs.push({h,cols:ths.map((th,i)=>({h:T(th),w:i===0?.34:.66/Math.max(1,n-1),al:i?"r":""})),rows:rows.map(c=>({cells:c})),text:rows.map(c=>c.map(x=>x.t).join(", "))});return}
    const tiles=[...el.children].filter(d=>d.querySelector("b")).map(d=>({l:T(d.querySelector(".lab,span")),v:T(d.querySelector("b")),s:T(d.querySelector("small"))}));

  return out}

function ptMuseumView(board,o){o=o||{};board=board||{};const MI={};P.mins.forEach(m=>MI[m.n.toLowerCase()]=m);
