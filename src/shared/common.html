  secs.forEach(s=>{if(s.h){c.fillStyle="#e6e9ec";c.font=`700 19px ${FD}`;c.fillText(s.h,PAD,y+26);y+=40}else y+=8;
    const cx=[];let acc=PAD+12;s.cw.forEach(w=>{cx.push(acc);acc+=w});
    c.font=`600 11px ${F}`;c.fillStyle="#98a2ad";s.cols.forEach((k,i)=>{const u=String(k.h).toUpperCase();c.fillText(u,k.al==="r"?cx[i]+s.cw[i]-18-c.measureText(u).width:k.al==="c"?cx[i]+(s.cw[i]-c.measureText(u).width)/2:cx[i],y+20)});
    y+=30;c.strokeStyle="#2c333a";c.lineWidth=1;c.beginPath();c.moveTo(PAD,y);c.lineTo(W-PAD,y);c.stroke();
    let k=0;s.rows.forEach(r=>{if(r.group){c.fillStyle="#98a2ad";c.font=`700 12px ${F}`;c.fillText(fit(r.group.toUpperCase(),W-PAD*2-24),PAD+12,y+24);y+=r.h;k=0;return}
      if(k++%2){c.fillStyle="#191d22";c.fillRect(PAD,y,W-PAD*2,r.h)}
      r.cells.forEach((L,i)=>{const C=L.c,al=s.cols[i].al;if(C.bg){c.fillStyle=C.bg;c.fillRect(cx[i]-6,y+3,s.cw[i]-4,r.h-6)}
        let x=cx[i];const top=y+(r.h-L.h)/2;
        if(C.chips){L.rows.forEach((rw,j)=>{let xx=x;rw.forEach(ch=>{const col=ch.col||"#e6e9ec";c.strokeStyle=col+"88";rr(xx,top+j*26,ch.w,21,10.5);c.stroke();c.fillStyle=col;c.font=`12px ${F}`;c.fillText(ch.t,xx+9,top+j*26+14.5);xx+=ch.w+6})});return}
        if(C.dot){c.fillStyle=C.dot;c.beginPath();c.arc(x+6,top+L.lh/2,5,0,Math.PI*2);c.fill();x+=18}
        if(C.ic&&IMG[C.ic]){c.drawImage(IMG[C.ic],x,y+r.h/2-13,26,26);x+=34}
        c.font=fontOf(C);const w=s.cw[i]-20-(x-cx[i]);
        L.lines.forEach((ln,j)=>{const t=fit(ln,w);c.fillStyle=C.col||"#e6e9ec";const tx=al==="r"?cx[i]+s.cw[i]-18-c.measureText(t).width:al==="c"?cx[i]+(s.cw[i]-c.measureText(t).width)/2:x;c.fillText(t,tx,top+j*L.lh+L.lh-5)});
        if(C.sub){c.font=`11.5px ${F}`;c.fillStyle=C.subcol||"#98a2ad";const t=fit(C.sub,w);c.fillText(t,al==="r"?cx[i]+s.cw[i]-18-c.measureText(t).width:x,top+L.lines.length*L.lh+12)}});
      y+=r.h});
    y+=20});
  if(o.note){const et=o.note;c.font=`600 13px ${F}`;const ew=Math.min(W-PAD*2,c.measureText(et).width+30),ex=PAD,ey=y;c.fillStyle="rgba(239,122,102,.14)";rr(ex,ey,ew,28,14);c.fill();c.strokeStyle="rgba(239,122,102,.65)";rr(ex,ey,ew,28,14);c.stroke();c.fillStyle="#ef7a66";c.beginPath();c.arc(ex+13,ey+14,3,0,Math.PI*2);c.fill();c.fillText(fit(et,ew-30),ex+22,ey+18.5)}
  return await new Promise(res=>cv.toBlob(res,"image/png"))}
function ptToast(t){const d=document.createElement("div");d.className="ptoast";d.setAttribute("role","status");d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),2200)}
async function ptSaveImg(name,make){let blob=null;try{blob=await make()}catch(e){console.error(e)}if(!blob){ptToast("Couldn't draw the image");return}
  try{await window.parent.ptSave(name.replace(/[\\/:*?"<>|]+/g," ").trim()+".png",blob);ptToast((()=>{try{return window.parent.ptImgMsg()}catch(e){return "Image saved"}})())}catch(e){const c=e&&e.code;if(c!=="declined")ptToast(c==="rate_limited"?"A save prompt is already open":"Couldn't save the image here")}}
</script>
