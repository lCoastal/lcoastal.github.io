<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>:root{color-scheme:light}body{margin:0;font-size:14px}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Test Log</title>

%%COMMON%%
<style data-file="style.css"></style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Test Log</h1>
    <p class="lede">Every test behind the toolkit's formulas: what was tested, how much, what it showed and what changed.<br>No raw data here, just the summary of each session.</p>
  </header>
  <section class="tiles" id="tiles" aria-label="Totals"></section>
  <section class="card"><h2>What the tests show</h2><ul class="find" id="find"></ul></section>
  <section class="card"><h2>Still open</h2><ul class="find open" id="open"></ul></section>
  <div class="frow" id="topics"><span class="lab">Topic</span></div>
  <div class="frow"><label class="srch"><span class="lab">Search</span><input id="q" type="search" placeholder="Zone, mineral, modifier…" aria-label="Search sessions"></label><span class="count" id="count" aria-live="polite"></span></div>
  <section id="list" class="sessions"></section>
  <p class="foot">Tests by @__coastal · Last edited 20/11/26 · Made by @__coastal</p>
</div>
<script data-file="script.js"></script>

</body>
</html>
